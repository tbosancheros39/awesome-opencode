name: opencode-thinking-fix
repo: https://github.com/tbosancheros39/opencode-thinking-fix
npm: opencode-thinking-fix
tagline: Keeps reasoning content across turns so reasoning models stop returning 400s
description: A plugin plus an optional proxy that puts the reasoning content back on every later turn. Some providers reject a request whose assistant turns lost their chain of thought, and some silently drop the earlier reasoning; either way the model forgets what it was working on by turn two. The plugin preserves the field on the context hook with no configuration, and the proxy caches the real reasoning from the SSE stream and replays it. Covers DeepSeek, Kimi, GLM, MiMo, MiniMax, InclusionAI Ling, OpenCode Go and OpenRouter.
kind: plugin
topics:
  - context
  - providers
compat: v2
tags:
  - reasoning
  - reasoning-content
  - deepseek
  - kimi
  - glm
  - minimax
  - proxy
installation: npm i opencode-thinking-fix
